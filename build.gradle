// This is a minimal setup of a Forge mod workspace.
// For complex examples (including AccessTransformers, Jar-in-Jar, and Mixin), see our examples repository.
// https://github.com/MinecraftForge/MDKExamples


plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '5.1.+' 
}

base {
    archivesName = 'csa_custom_boss_mod'
}

version = '1.0.0'
group = 'com.arnav.csa_custom_boss_mod'

// Forge 1.20.1 requires Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            jvmArg '-XstartOnFirstThread'
            property 'eventbus.api.strictRuntimeChecks', 'true'
            property 'forge.enabledGameTestNamespaces', 'csa_custom_boss_mod'
        }

        server {
            args '--nogui'
        }

        gameTestServer

        data {
            args '--mod', 'csa_custom_boss_mod', '--all', '--output', file('src/generated/resources'), '--existing', file('src/main/resources')
        }
    }
}

repositories {
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net/'
    }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
}

tasks.withType(JavaCompile).configureEach {
    // Use the UTF-8 charset for Java compilation
    // This is done by default in Java 18+, but this ensures it no matter the Java or Gradle version
    options.encoding = 'UTF-8'
}
